# CI (BRIEF4 Phase 7): lint, unit tests on the tiny fixtures + committed demo products, frontend build.
# The large reproducible data (data/synthetic, data/real NetCDF) are not in git; tests that need them
# skip themselves (tests/conftest.py), everything else runs.
name: ci
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.9 pytest-cov==7.1.0
      - name: Lint (ruff)
        run: ruff check pipeline backend scripts synth tests
      - name: Tests (tiny fixtures)
        env:
          SIH_FIXTURES: tests/fixtures
        run: pytest -q --cov=pipeline --cov=backend --cov-report=term-missing:skip-covered
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npx vite build
