# API + dashboard + operational worker (BRIEF4 Phase 5). The worker watches ./inbox for new
# 12 km ensemble NetCDF / GRIB2 files and writes products that the API serves.
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./backend/products:/app/backend/products
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "pipeline.run_operational", "--watch", "/inbox", "--out", "/app/backend/products"]
    volumes:
      - ./inbox:/inbox
      - ./backend/products:/app/backend/products
      - ./logs:/app/logs
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API: http://localhost:8000
    ports: ["8080:80"]
    depends_on: [api]
